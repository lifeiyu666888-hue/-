name: Build iOS Liquid Glass Weather APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Install JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 3. Configure Pre-installed Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 4. Enable INTERNET Permission for Live Weather API
        run: |
          if ! grep -q "android.permission.INTERNET" app/src/main/AndroidManifest.xml; then
            sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET" \/>\n    <application/' app/src/main/AndroidManifest.xml
          fi

      - name: 5. Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: 6. Compile & Package APK
        run: |
          gradle assembleDebug --stacktrace

      - name: 7. Prepare APK Output
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LiuliWeather-iOS-LiquidGlass.apk

      - name: 8. Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LiuliWeather-iOS-LiquidGlass-APK
          path: LiuliWeather-iOS-LiquidGlass.apk

      - name: 9. Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: "琉璃天气 iOS Liquid Glass APK v2.0.${{ github.run_number }}"
          body: "云端自动编译生成的琉璃天气安装包（LiuliWeather-iOS-LiquidGlass.apk），点击下方 Assets 即可直接下载安装。"
          files: LiuliWeather-iOS-LiquidGlass.apk
